name: WatchValue CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax
        run: |
          node --check server.js
          node --check worker.js
          node --check app.js
          node --check catalog/import-catalog.js
          node --check qa/validate-catalog.mjs
          node --check qa/validate-marketplace.mjs
          node --check market/normalize-marketplace.mjs
          node --check market/variant-fingerprint.mjs

      - name: JSON parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('catalog/core-references.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('catalog/core-variants.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('market/verified-observations.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('market/verified-marketplace-listings.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('market/verified-retail-prices.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('market/variant-rules.json','utf8'))"

      - name: Catalog and provenance QA
        run: node qa/validate-catalog.mjs

      - name: Marketplace identity QA
        run: node qa/validate-marketplace.mjs
